<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f3">
  <meta name="description" content="Ein kleines digitales Album voller gemeinsamer Erinnerungen.">
  <title>Unsere Erinnerungen ♥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="login" class="login-card">
      <div class="heart">♥</div>
      <p class="eyebrow">EIN KLEINES GEHEIMNIS</p>
      <h1>Nur für dich</h1>
      <p class="intro">Ein kleiner Ort voller Erinnerungen. Gib unser Geheimnis ein.</p>
      <form id="loginForm">
        <input type="password" id="password" placeholder="Unser Passwort" autocomplete="off" required aria-label="Passwort">
        <button type="submit">Öffnen ♥</button>
      </form>
      <p id="fehler" role="status"></p>
    </section>

    <section id="home" hidden>
      <header class="hero">
        <p class="eyebrow">NUR WIR ZWEI</p>
        <h1>Unsere Erinnerungen <span>♥</span></h1>
        <p class="intro">Kleine Orte, große Erinnerungen und ganz viele Momente mit dir.</p>
      </header>
      <div id="orte" class="places"></div>
    </section>

    <section id="detail" hidden>
      <button id="backButton" class="back-button" type="button"><span aria-hidden="true">←</span> Alle Erinnerungen</button>
      <header class="detail-header">
        <p class="eyebrow">EIN KAPITEL UNSERER GESCHICHTE</p>
        <h1 id="placeTitle"></h1>
        <div id="placeDescription" class="description"></div>
      </header>
      <div id="albumArea" class="album-area"></div>
    </section>
    <footer>Mit ganz viel Liebe für dich gemacht ♥</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
